name: Deploy da Minha API

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: matewanga
          password: ${{ secrets.DOCKERHUB_Matewanga }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/minha-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/minha-api:${{ github.sha }}

      - name: Disparar deploy no Render
        env:
          RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error "$RENDER_URL"
